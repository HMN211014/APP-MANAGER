<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Administrador de cuentas</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#fafaf8;--fg:#1b1b1a;--mut:#8b8b86;--line:#ebeae6;--fill:#f1f0ec;
  --ok:#2f8f5b;--warn:#c27f12;--bad:#c94b4b;--info:#4f6bd8;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121211;--fg:#ecece8;--mut:#8e8e88;--line:#242422;--fill:#1b1b1a;
    --ok:#4cc48a;--warn:#f0b34a;--bad:#ff7b7b;--info:#8da2ff;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121211;--fg:#ecece8;--mut:#8e8e88;--line:#242422;--fill:#1b1b1a;
  --ok:#4cc48a;--warn:#f0b34a;--bad:#ff7b7b;--info:#8da2ff;color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
.app{height:100%;max-width:1000px;margin:0 auto;display:flex;flex-direction:column}
main{flex:1;overflow-y:auto;padding:22px 18px 28px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.nav{flex:none;display:flex;border-top:1px solid var(--line);background:var(--bg)}
.nav button{flex:1;border:0;background:none;padding:12px 2px;font-size:.78rem;color:var(--mut);display:flex;align-items:center;justify-content:center;gap:6px}
.nav button.on{color:var(--fg);font-weight:600}
.nav .plus i{font-style:normal;width:38px;height:38px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-size:1.4rem;line-height:1}
.nav .plus span{display:none}
@media (min-width:860px){
  .app{flex-direction:row}
  .nav{order:-1;flex-direction:column;width:190px;border-top:0;border-right:1px solid var(--line);padding:22px 10px;gap:2px}
  .nav button{flex:none;justify-content:flex-start;padding:9px 12px;border-radius:10px;font-size:.92rem}
  .nav button.on{background:var(--fill)}
  .nav .plus{margin-top:12px;color:var(--fg)}
  .nav .plus i{width:auto;height:auto;border-radius:10px;padding:7px 11px;font-size:1rem}
  .nav .plus span{display:inline}
  main{padding:30px 34px}
}
h1{font-size:1.5rem;font-weight:600;margin:0 0 2px;letter-spacing:-.02em}
h3{font-size:.7rem;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.09em;margin:26px 0 6px}
.sub0{color:var(--mut);font-size:.88rem;margin:0 0 18px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.tile{background:var(--fill);border:0;border-radius:12px;padding:14px 12px;text-align:left}
.tile b{display:block;font-size:1.6rem;font-weight:500;letter-spacing:-.02em}
.tile span{font-size:.74rem;color:var(--mut)}
.row{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:currentColor}
.main1{flex:1;min-width:0}
.t1{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t2{font-size:.78rem;color:var(--mut)}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.info{color:var(--info)}
.mini{border:1px solid var(--line);background:none;border-radius:8px;padding:7px 10px;font-size:.78rem}
.mini:active{background:var(--fg);color:var(--bg)}
.empty{color:var(--mut);font-size:.9rem;padding:14px 2px;margin:0}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);font:inherit;font-size:16px}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--fg)}
label{display:block;font-size:.74rem;color:var(--mut);margin:12px 0 4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 4px}
.btn{border:1px solid var(--line);background:none;border-radius:10px;padding:11px 14px;font-size:.92rem}
.btn.p{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:600}
.btn.d{color:var(--bad)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.acts .btn{flex:1}
.tabs{display:flex;gap:20px;border-bottom:1px solid var(--line);margin-top:14px}
.tabs button{border:0;background:none;padding:8px 0;color:var(--mut)}
.tabs button.on{color:var(--fg);border-bottom:2px solid var(--fg);font-weight:600}
.menu{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 2px}
.menu small{display:block;color:var(--mut)}
.pw{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.92rem;overflow-wrap:anywhere}
.ins{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.prev{white-space:pre-wrap;background:var(--fill);border-radius:10px;padding:10px;font:inherit;font-size:.82rem;max-height:200px;overflow:auto;margin:0}
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
.backdrop.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;background:var(--bg);border-radius:20px 20px 0 0;max-height:90%;overflow-y:auto;transform:translateY(105%);transition:transform .25s ease;padding:12px 18px calc(20px + env(safe-area-inset-bottom,0px));z-index:11;overscroll-behavior:contain;border:1px solid var(--line)}
.sheet.on{transform:none}
.grab{width:38px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 12px}
.sh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.sh h2{font-size:1.05rem;font-weight:600;margin:0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.x{width:36px;height:36px;border-radius:50%;border:0;background:var(--fill);font-size:1rem;flex:none}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%) translateY(-20px);background:var(--fg);color:var(--bg);padding:9px 18px;border-radius:99px;font-size:.86rem;opacity:0;pointer-events:none;transition:all .2s;z-index:30;white-space:nowrap}
.toast.on{opacity:.96;transform:translateX(-50%)}
:root{--bg:#f6f7fc;--fg:#1c1e2b;--mut:#7b8096;--line:#e3e6f1;--fill:#eceffa;--acc:#5b5bd6;--acc-t:#fff;--acc-bg:#e9e9fb;--ok:#1f9d55;--warn:#d98a00;--bad:#e04848;--info:#3b6ff0;--ok-bg:#dff3e7;--warn-bg:#fbefd5;--bad-bg:#fbe3e3;--info-bg:#e2e9fd}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f1117;--fg:#eceef6;--mut:#8b90a5;--line:#252936;--fill:#181b25;--acc:#8b8bff;--acc-t:#0f1117;--acc-bg:#23244a;--ok:#4cc48a;--warn:#f0b34a;--bad:#ff7b7b;--info:#8da2ff;--ok-bg:#16322a;--warn-bg:#392d14;--bad-bg:#3a1c1f;--info-bg:#1d2a4d}}
.nav button.on{color:var(--acc)}
.nav .plus i{background:var(--acc);color:var(--acc-t)}
@media (min-width:860px){.nav button.on{background:var(--acc-bg)}}
.btn.p{background:var(--acc);border-color:var(--acc);color:var(--acc-t)}
.tabs button.on{color:var(--acc);border-bottom-color:var(--acc)}
.tile{border-radius:14px}
.t-all{background:var(--acc-bg)}.t-all b{color:var(--acc)}
.t-ok{background:var(--ok-bg)}.t-ok b{color:var(--ok)}
.t-warn{background:var(--warn-bg)}.t-warn b{color:var(--warn)}
.t-bad{background:var(--bad-bg)}.t-bad b{color:var(--bad)}
.t-reqs{background:var(--info-bg)}.t-reqs b{color:var(--info)}
.hero{background:linear-gradient(135deg,#5b5bd6,#a35bd6 60%,#e05b9a);color:#fff;border-radius:20px;padding:20px 18px;margin-bottom:14px}
.hero h1{color:#fff}.hero p{margin:2px 0 0;opacity:.9;font-size:.9rem}
.hero .big{font-size:2.2rem;font-weight:600;letter-spacing:-.03em;margin-top:10px}
.av{width:38px;height:38px;border-radius:12px;flex:none;display:grid;place-items:center;color:#fff;font-style:normal;font-weight:700;font-size:.95rem}
.pill{font-size:.72rem;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap}
.pill.ok{background:var(--ok-bg)}.pill.warn{background:var(--warn-bg)}.pill.bad{background:var(--bad-bg)}.pill.info{background:var(--info-bg)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:7px 13px;font-size:.82rem;display:flex;align-items:center;gap:6px}
.chip i{width:8px;height:8px;border-radius:50%}
.chip.on{background:var(--acc);color:var(--acc-t);border-color:var(--acc)}
.ban{border-radius:14px;padding:12px;display:flex;align-items:center;gap:12px;margin:2px 0 4px}
.pbar{height:6px;border-radius:6px;background:var(--fill);margin-top:6px;overflow:hidden}
.pbar b{display:block;height:100%;border-radius:6px}
.cat{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.cat button{border:0;color:#fff;font-weight:600;font-size:.82rem;border-radius:99px;padding:8px 13px}
input[type=color]{padding:3px;height:44px}
.slots{display:flex;align-items:center;gap:4px;margin-top:6px;flex-wrap:wrap}
.sl{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--mut);opacity:.5;flex:none}
.sl.f,.sl.h,.sl.ov{border-color:transparent}
.sl.f{opacity:1}.sl.h{opacity:.45}.sl.ov{background:var(--bad);opacity:1}
.sl-t{font-size:.72rem;color:var(--mut);margin-left:4px}
.sl-t.bad{color:var(--bad)}.sl-t.info{color:var(--info)}
.pfs{display:flex;flex-wrap:wrap;gap:8px 6px;margin:8px 0 4px}
.pf{position:relative;display:grid;justify-items:center;align-content:start;gap:4px;flex:none;width:56px;font-size:.68rem;color:var(--mut);text-align:center;border:0;background:none;padding:0}
.pf i{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-style:normal;font-weight:700;font-size:1rem}
.pf span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pf.o i{opacity:.75}
.pf.h i{opacity:.5}
.pf.n i{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--acc)}
.pf.ov i{background:var(--bad)!important}
.pf.e i{background:none;border:2px dashed var(--mut);opacity:.45}
.pf .rm{position:absolute;top:-3px;right:3px;width:17px;height:17px;border-radius:50%;background:var(--fg);color:var(--bg);font-size:.6rem;font-weight:600;display:grid;place-items:center}
.addrow{display:flex;gap:8px}.addrow .btn{flex:none}
.pf.late i{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--bad)}
.tl{margin-top:10px}
.tli{position:relative;display:flex;gap:12px;padding-bottom:14px}
.tli:last-child{padding-bottom:0}
.tli:not(:last-child)::before{content:"";position:absolute;left:5px;top:16px;bottom:-2px;width:2px;background:var(--line)}
.tld{width:12px;height:12px;border-radius:50%;margin-top:4px;flex:none;background:currentColor}
.tld.end{background:var(--bg);border:2px solid currentColor}
.tli b{display:block;font-weight:600;font-size:.9rem}
.tli span{display:block;font-size:.8rem;color:var(--mut)}
.tli em{font-style:normal}
@media (max-width:859px){.nav button{font-size:.72rem;padding-left:0;padding-right:0}}
.av.rd{border-radius:50%}
</style>
</head>
<body>
<div class="app">
  <main id="view"></main>
  <nav class="nav">
    <button data-v="home">Inicio</button>
    <button data-v="accs">Cuentas</button>
    <button data-v="profs">Perfiles</button>
    <button class="plus" data-act="plus" aria-label="Nuevo"><i>+</i><span>Nuevo</span></button>
    <button data-v="reqs">Solicitudes</button>
    <button data-v="more">Más</button>
  </nav>
</div>
<div class="backdrop" id="bd"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script>
(function(){
  var KEY='cuentas-v1', PKEY='plataformas-v1', RKEY='solicitudes-v1', DAYS=30;
  var data=[], plats=[], reqs=[], lastPlat='';
  var view='home', fStat='all', fPlatF='', query='', lim=15, tab='act', mode=null, curId=null, curReq=null, showPw=false, ed='';
  var RS={pend:['Pendiente','warn'],proc:['En proceso','info'],done:['Completada','ok'],canc:['Cancelada','bad']};
  var $=function(id){return document.getElementById(id)};
  var TPL=`🎀*FICHA ENTREGA* 

*{plataforma}*
🎀Fecha: {fecha} 🗓️

🎀Correo: {correo}
🎀Contraseña: {contrasena}
🎀NIP: {nip}

*Acceso solo a {perfil}*👤

Favor de no entrar a ningún otro perfil, solo al tuyo! 

*REGLAS DE GARANTÍA*

🫰🏼CONFIRMA TU ACCESO A MÁS TARDAR 24 HORAS
🫰🏼NO CAMBIAR CONTRASEÑA O CORREO NI DATOS DEL PERFIL,
🫰🏼RECUERDA UN SOLO DISPOSITIVO

📸*Mandar foto o captura antes de las 24 hrs de pantalla para validar tu garantía, persona que no mande foto, pierde su garantía.*

GARANTÍA DE {garantia} DÍAS SIEMPRE Y CUANDO SE RESPETEN LAS REGLAS 🙂‍↕️`;

  /* ---------- utilidades ---------- */
  function pad(n){return n<10?'0'+n:''+n}
  function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
  function parse(s){var a=s.split('-');return new Date(+a[0],+a[1]-1,+a[2])}
  function addDays(s,n){var d=parse(s);d.setDate(d.getDate()+n);return iso(d)}
  function fmt(s){return parse(s).toLocaleDateString('es-MX',{day:'2-digit',month:'short',year:'numeric'})}
  function fmtS(s){return parse(s).toLocaleDateString('es-MX',{day:'2-digit',month:'short'})}
  var MES=['ENERO','FEBRERO','MARZO','ABRIL','MAYO','JUNIO','JULIO','AGOSTO','SEPTIEMBRE','OCTUBRE','NOVIEMBRE','DICIEMBRE'];
  function fmtL(s){var d=parse(s);return d.getDate()+' '+MES[d.getMonth()]+' '+d.getFullYear()}
  function parseD(s){
    if(!s)return '';var m=s.match(/^(\d{4})-(\d{2})-(\d{2})$/);if(m)return s;
    m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);if(m)return m[3]+'-'+pad(+m[2])+'-'+pad(+m[1]);return '';
  }
  function today(){var d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
  function daysLeft(e){return Math.round((parse(e)-today())/86400000)}
  function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function byExp(a,b){return a.exp<b.exp?-1:a.exp>b.exp?1:0}
  function find(id){for(var i=0;i<data.length;i++)if(data[i].id===id)return data[i]}
  function pById(id){for(var i=0;i<plats.length;i++)if(plats[i].id===id)return plats[i]}
  function pOf(a){return pById(a.plat)}
  function reqById(id){for(var i=0;i<reqs.length;i++)if(reqs[i].id===id)return reqs[i]}
  /* catálogo de plataformas: [nombre, color, acceso, NIP sugerido] */
  var CAT=[['Netflix','#E50914','pass','opt'],['Disney+','#113CCF','pass','opt'],['Prime Video','#00A8E1','pass','opt'],['HBO Max','#5B2CCB','pass','opt'],['ViX','#FF6B00','pass','no'],['Paramount+','#0064FF','pass','opt'],['Apple TV+','#2B2B2E','pass','no'],['YouTube Premium','#FF0033','pass','no'],['Crunchyroll','#F47521','pass','no'],['Claro video','#DA291C','pass','no'],['Spotify','#1DB954','pass','no'],['Apple Music','#FA243C','pass','no'],['Deezer','#8B5CF6','pass','no'],['Plex','#E5A00D','pass','no']];
  var PAL=['#5b5bd6','#e05b9a','#14b8a6','#f59e0b','#3b82f6','#ef4444','#8b5cf6','#10b981'];
  function catFind(n){n=(n||'').toLowerCase().trim();if(!n)return;for(var i=0;i<CAT.length;i++){var c=CAT[i][0].toLowerCase();if(n===c||n.indexOf(c)===0)return CAT[i]}}
  function colorOf(p){if(!p)return '#9aa0b5';if(p.color)return p.color;var c=catFind(p.name);if(c)return c[1];var h=0;for(var i=0;i<p.name.length;i++)h=(h*31+p.name.charCodeAt(i))>>>0;return PAL[h%PAL.length]}
  function av(p){return '<i class="av" style="background:'+colorOf(p)+'">'+esc(p?p.name.charAt(0).toUpperCase():'?')+'</i>'}
  function chip(id,n,c,col){return '<button class="chip'+(fPlatF===id?' on':'')+'" data-chip="'+id+'"><i style="background:'+col+'"></i>'+esc(n)+' · '+c+'</button>'}
  function byPlat(){
    var cnt={},mx=0;data.forEach(function(a){var k=a.plat||'';cnt[k]=(cnt[k]||0)+1;});
    var L=plats.filter(function(p){return cnt[p.id]}).sort(function(x,y){return cnt[y.id]-cnt[x.id]});
    L.forEach(function(p){if(cnt[p.id]>mx)mx=cnt[p.id]});
    if(!L.length)return '<p class="empty">Aún no hay cuentas por plataforma.</p>';
    return L.map(function(p){return '<div class="row" data-pf="'+p.id+'">'+av(p)+'<div class="main1"><div class="t1">'+esc(p.name)+'</div><div class="pbar"><b style="width:'+Math.round(cnt[p.id]/mx*100)+'%;background:'+colorOf(p)+'"></b></div></div><b>'+cnt[p.id]+'</b></div>'}).join('');
  }
  /* ---------- perfiles y ocupación de cuentas ---------- */
  var qNames=[],curPi=0,pq='',pStatF='all';
  function nameColor(n){var h=0;n=String(n).toLowerCase();for(var i=0;i<n.length;i++)h=(h*31+n.charCodeAt(i))>>>0;return PAL[h%PAL.length]}
  /* nombres de los perfiles de una solicitud (las solicitudes anteriores solo traen nombre y cantidad) */
  function reqNames(r){
    if(r.names&&r.names.length)return r.names;
    var q=Math.max(1,parseInt(r.qty,10)||1),b=r.name||'Perfil',o=[];
    if(q===1)return [b];
    for(var i=1;i<=q;i++)o.push(b+' '+i);
    return o;
  }
  /* ---------- tiempo de cada perfil: cronología propia, separada de la de la cuenta ---------- */
  /* corre desde el ingreso del perfil; las solicitudes anteriores calculan su vencimiento desde su fecha */
  function reqExp(r){return r.exp||addDays(r.date||iso(today()),DAYS)}
  function reqStart(r){var rn=r.renewals;return rn&&rn.length?rn[rn.length-1]:(r.date||iso(today()))}
  function rTime(r){
    if(r.status==='canc')return null;
    var s=status({exp:reqExp(r)});s.t=s.t.replace('Vencida','Vencido'); /* perfil, no cuenta */
    return s;
  }
  function timeline(r){
    var ev=[{d:r.date||iso(today()),t:'Ingreso del perfil',c:'ok'}],h='',e=reqExp(r),s=rTime(r),bar='';
    (r.renewals||[]).forEach(function(x){ev.push({d:x,t:'Renovado',c:'info'})});
    ev.forEach(function(x){h+='<div class="tli"><i class="tld '+x.c+'"></i><div><b>'+x.t+'</b><span>'+fmt(x.d)+'</span></div></div>'});
    if(s){
      h+='<div class="tli"><i class="tld end '+s.c+'"></i><div><b>'+(daysLeft(e)<0?'Venció':'Vence')+'</b><span>'+fmt(e)+' · <em class="'+s.c+'">'+s.t+'</em></span></div></div>';
      var st=reqStart(r),tot=Math.max(1,Math.round((parse(e)-parse(st))/86400000)),el=Math.round((today()-parse(st))/86400000);
      bar='<div class="pbar" style="margin:2px 0 4px"><b style="width:'+Math.max(0,Math.min(100,Math.round(el/tot*100)))+'%;background:var(--'+s.c+')"></b></div>';
    }else h+='<div class="tli"><i class="tld end" style="color:var(--mut)"></i><div><b>Cancelada</b><span>Sin cuenta regresiva</span></div></div>';
    return bar+'<div class="tl">'+h+'</div>';
  }
  /* perfiles que ocupan una cuenta: todas las solicitudes menos las canceladas (los vencidos se marcan, pero siguen contando) */
  function slotsOf(a){
    var out=[];

  /* ---------- detección de correo y contraseña en texto pegado ---------- */
  var EMAIL_FIND=/[A-Za-z0-9._%+\-]+@[A-Za-z0-9\-]+(?:\.[A-Za-z0-9\-]+)*\.[A-Za-z]{2,}/;
  var PASS_LBL=/(?:^|[^A-Za-zÀ-ÿ0-9])(?:contrase[ñn]a|password|pass|clave|pwd|psw)[*~`]*(?:(\s*[:：=\-–—]\s*)|\s+)[*~`]*\s*(\S.*)$/i;
  var NOPASS=/^(?:sin\b|no\b|ninguna?\b|n\/?a\b|-+$|c[oó]digo|code\b)/i;
  var CODEHINT=/\b(?:sin\s+(?:contrase[ñn]a|clave|password|pass)|c[oó]digo)\b/i;
  var DATE_TOK=/^\d{1,4}[\/\-.]\d{1,2}[\/\-.]\d{1,4}$/;
  var PASTE_HINT='Pega el correo y la contraseña y se llenan solos. Si no hay contraseña, queda como «con código».';
  function cleanVal(v){
    v=v.trim();var w=v.charAt(0),e=v.charAt(v.length-1);
    if(v.length>1&&('*~`"\''.indexOf(w)>-1&&e===w||w==='“'&&e==='”'||w==='‘'&&e==='’'))v=v.slice(1,-1);
    return v.trim();
  }
  function knownName(tok){
    var l=tok.toLowerCase();
    return plats.some(function(p){return String(p.name).toLowerCase()===l})||CAT.some(function(c){return c[0].toLowerCase()===l});
  }
  function detectCred(txt){
    var out={email:'',pass:''};
    var t=String(txt||'').normalize('NFC').replace(/[​-‏‪-‮﻿]/g,'');
    if(!t.trim())return out;
    var m=t.match(EMAIL_FIND);if(m)out.email=m[0];
    var lines=t.split(/\r?\n/),labeled=false,i,mm,v;
    /* 1) contraseña con etiqueta: "Contraseña: abc", "*Clave:* abc", "pass abc" */
    for(i=0;i<lines.length&&!labeled;i++){
      mm=lines[i].match(PASS_LBL);if(!mm)continue;
      labeled=true;v=mm[2];
      if(!mm[1])v=v.split(/\s+/)[0];
      v=v.split(/\s+(?:correo|e-?mail|nip|pin|perfil|usuario|user|fecha)\s*[:=]/i)[0];
      if(out.email&&v.indexOf(out.email)>-1)v=v.slice(0,v.indexOf(out.email));
      v=cleanVal(v);
      if(v&&!NOPASS.test(v))out.pass=v;
    }
    /* 2) sin etiqueta: la palabra que va justo después del correo (misma línea o línea siguiente) */
    if(!out.pass&&!labeled&&m&&!CODEHINT.test(t.replace(out.email,' '))){
      var li=-1;for(i=0;i<lines.length;i++)if(lines[i].indexOf(out.email)>-1){li=i;break}
      var rest=lines[li].slice(lines[li].indexOf(out.email)+out.email.length).replace(/^[\s,;:|\/\-–—]+/,'');
      var tok=(rest.match(/^\S+/)||[''])[0];
      if(!tok){
        for(i=li+1;i<lines.length;i++){var nl=lines[i].trim();if(!nl)continue;if(/^\S+$/.test(nl)&&nl.indexOf('@')<0)tok=nl;break}
      }
      tok=cleanVal(tok);
      if(tok&&/[A-Za-z0-9À-ÿ]/.test(tok)&&!DATE_TOK.test(tok)&&!/[:：]$/.test(tok)&&!NOPASS.test(tok)&&!knownName(tok)&&tok.indexOf('@')<0)out.pass=tok;
    }
    return out;
  }
  function applyPaste(){
    var ta=$('fPaste'),st=$('pStat');if(!ta||!st)return;
    if(!ta.value.trim()){st.className='t2';st.textContent=PASTE_HINT;return;}
    var r=detectCred(ta.value);
    if(!r.email&&!r.pass){st.className='t2 warn';st.textContent='No encontré correo ni contraseña en el texto.';return;}
    if(r.email){
      $('fEmail').value=r.email;$('fPass').value=r.pass;$('fAcc').value=r.pass?'pass':'code';
      st.className='t2 '+(r.pass?'ok':'info');
      st.textContent=r.pass?'✓ Correo y contraseña detectados.':'✓ Correo detectado. No hay contraseña: se guarda como «con código».';
    }else{
      $('fPass').value=r.pass;$('fAcc').value='pass';
      st.className='t2 warn';st.textContent='Detecté la contraseña, pero no el correo. Escríbelo abajo.';
    }
    togglePass();
  }

  function sheetBak(){
    $('sheet').innerHTML=hd('Respaldo de datos')+
      '<p class="t2" style="margin:0 0 8px">Tus datos se guardan solo en este navegador y dispositivo. Copia un respaldo y guárdalo en un lugar seguro.</p>'+
      '<div class="acts" style="margin-top:0"><button class="btn p" data-act="backup">Copiar respaldo</button></div>'+
      '<label for="fRestore">Pegar respaldo para restaurar</label><textarea id="fRestore" rows="3" placeholder="Pega aquí el respaldo"></textarea>'+
      '<div class="acts"><button class="btn" data-act="restore">Restaurar</button></div>';
    open('bak');
  }

  /* ---------- eventos ---------- */
  document.addEventListener('click',function(e){
    var t=e.target,x;
    if((x=t.closest('[data-v]'))){go(x.dataset.v);return;}
    if((x=t.closest('[data-stat]'))){fStat=x.dataset.stat;fPlatF='';query='';go('accs');return;}
    if((x=t.closest('[data-pf]'))){fPlatF=x.dataset.pf;fStat='all';query='';go('accs');return;}
    if((x=t.closest('[data-chip]'))){fPlatF=x.dataset.chip;lim=15;render();return;}
    if((x=t.closest('[data-go]'))){go(x.dataset.go);return;}
    if((x=t.closest('[data-tab]'))){tab=x.dataset.tab;render();return;}
    if((x=t.closest('[data-ins]'))){
      var ta=$('eTpl'),s0=ta.selectionStart,e0=ta.selectionEnd,tk='{'+x.dataset.ins+'}';
      ta.value=ta.value.slice(0,s0)+tk+ta.value.slice(e0);ta.focus();ta.selectionStart=ta.selectionEnd=s0+tk.length;updPrev();return;
    }
    if((x=t.closest('[data-editp]'))){sheetPlatEdit(x.dataset.editp);return;}
    if((x=t.closest('[data-cat]'))){sheetPlatEdit('',catFind(x.dataset.cat));return;}
    if((x=t.closest('[data-rmn]'))){qNames.splice(+x.dataset.rmn,1);drawQ();return;}
    var b=t.closest('[data-act]');
    if(b){
      var act=b.dataset.act,id=b.dataset.id||curId,a=id?find(id):null;
      if(act==='close')close();
      else if(act==='plus'){if(view==='reqs'||view==='profs')sheetNew();else sheetAcc();}
      else if(act==='pmore'){lim+=15;$('plist').innerHTML=profList();}
      else if(act==='more'){lim+=15;$('alist').innerHTML=aList();}
      else if(act==='cemail'&&a)copy(a.email,'Correo');
      else if(act==='cpass'&&a)copy(a.pass,'Contraseña');
      else if(act==='cboth'&&a)copy(a.email+'\n'+a.pass,'Correo y contraseña');
      else if(act==='eye'){showPw=!showPw;sheetDet(curId);}
      else if(act==='ficha'&&a)ficha(a,null);
      else if(act==='editacc')sheetAcc(curId);
      else if(act==='renew'&&a){if(confirm('¿Renovar? Creación hoy, vence en 30 días.')){a.created=iso(today());a.exp=addDays(a.created,DAYS);save();render();sheetDet(a.id);toast('✓ Cuenta renovada');}}
      else if(act==='del'&&a){if(confirm('¿Eliminar esta cuenta y sus solicitudes?')){data=data.filter(function(y){return y.id!==a.id});reqs=reqs.filter(function(r){return r.acc!==a.id});save();close();render();toast('Cuenta eliminada');}}
      else if(act==='newreq')sheetNew(b.dataset.id||'');
      else if(act==='savereq')saveReq();
      else if(act==='addname')addName();
      else if(act==='cpin'){var r1=reqById(curReq);if(r1)copy(r1.pin,'NIP');}
      else if(act==='rren')renewReq(reqById(curReq),function(x){sheetReq(x.id)});
      else if(act==='prren')renewReq(reqById(curReq),function(x){sheetProf(x.id,curPi)});
      else if(act==='saveprof')saveProf();
      else if(act==='preq'){if(curReq)sheetReq(curReq);}
      else if(act==='pficha'){
        var r7=reqById(curReq),a7=r7&&find(r7.acc),nm7=reqNames(r7||{})[curPi];
        if(a7)ficha(a7,{name:($('pName')&&$('pName').value.trim())||nm7,pin:r7.pin,date:r7.date});
      }
      else if(act==='rficha'){var r2=reqById(curReq),a2=r2&&find(r2.acc);if(a2)ficha(a2,r2);}
      else if(act==='rdel'){if(confirm('¿Eliminar esta solicitud?')){reqs=reqs.filter(function(r){return r.id!==curReq});save();close();render();}}
      else if(act==='saveacc')saveAcc(false);
      else if(act==='saveacc2')saveAcc(true);
      else if(act==='plats')sheetPlats();
      else if(act==='imp')sheetImp();
      else if(act==='bak')sheetBak();
      else if(act==='newplat')sheetPlatEdit('');
      else if(act==='saveplat'){
        var nm=$('eName').value.trim();if(!nm){toast('Escribe el nombre');return;}
        var mx=parseInt($('eMax').value,10)||0;if(mx<0||mx>20){toast('El límite va de 0 a 20 perfiles');return;}
        var o={name:nm,access:$('eAcc').value,nip:$('eNip').value,guar:parseInt($('eGuar').value,10)||0,max:mx,tpl:$('eTpl').value,color:$('eCol').value};
        var cp=pById(ed);
        if(cp){cp.name=o.name;cp.access=o.access;cp.nip=o.nip;cp.guar=o.guar;cp.max=o.max;cp.tpl=o.tpl;cp.color=o.color;}else{o.id=uid();plats.push(o);}
        save();render();sheetPlats();toast('✓ Plataforma guardada');
      }
      else if(act==='delplat'){
        if(confirm('¿Eliminar esta plataforma? Las cuentas se quedan, pero sin plataforma.')){
          plats=plats.filter(function(y){return y.id!==ed});
          data.forEach(function(y){if(y.plat===ed)y.plat='';});
          save();render();sheetPlats();
        }
      }
      else if(act==='doimp')doImp();
      else if(act==='backup')copy(JSON.stringify({v:3,cuentas:data,plataformas:plats,solicitudes:reqs}),'Respaldo');
      else if(act==='restore'){
        var tx=$('fRestore').value.trim();if(!tx){toast('Pega un respaldo');return;}
        try{
          var p2=JSON.parse(tx),ca=Array.isArray(p2)?p2:p2.cuentas;
          if(!Array.isArray(ca))throw 0;
          if(!confirm('Esto reemplaza tus datos actuales. ¿Continuar?'))return;
          data=ca;
          if(!Array.isArray(p2)){if(Array.isArray(p2.plataformas))plats=p2.plataformas;if(Array.isArray(p2.solicitudes))reqs=p2.solicitudes;}
          migrate();save();render();close();toast('✓ Respaldo restaurado');
        }catch(err){toast('Respaldo no válido');}
      }
      return;
    }
    if((x=t.closest('[data-oprof]'))){sheetProf(x.dataset.oprof,+x.dataset.pi);return;}
    if((x=t.closest('[data-open]'))){showPw=false;sheetDet(x.dataset.open);return;}
    if((x=t.closest('[data-oreq]'))){sheetReq(x.dataset.oreq);return;}
  });

  document.addEventListener('input',function(e){
    var id=e.target.id;
    if(id==='fDate'){var v=e.target.value;$('fExp').value=v?fmt(addDays(v,DAYS)):'';}
    else if(id==='fSearch'){query=e.target.value;lim=15;$('alist').innerHTML=aList();}
    else if(id==='eName'||id==='eTpl'||id==='eGuar')updPrev();
    else if(id==='eMax'||id==='eCol')updSlots();
    else if(id==='fPaste')applyPaste();
    else if(id==='pSearch'){pq=e.target.value;lim=15;$('plist').innerHTML=profList();}
  });
  document.addEventListener('change',function(e){
    var t=e.target;
    if(t.id==='fPlat'){var pt=$('fPaste');if(!(pt&&pt.value.trim()))$('fAcc').value=platAcc();togglePass();}
    else if(t.id==='fAcc')togglePass();
    else if(t.id==='qAcc'){togNip();drawQ();}
    else if(t.id==='rStat'){var r=reqById(curReq);if(r){r.status=t.value;save();render();sheetReq(r.id);toast('✓ Estado actualizado');}}
    else if(t.id==='rRen'){var r6=reqById(curReq);if(r6){r6.ren=t.value==='1';save();render();sheetReq(r6.id);toast(r6.ren?'✓ Perfil renovable':'✓ Perfil no renovable');}}
    else if(t.id==='fPlatF'){fPlatF=t.value;lim=15;render();}
    else if(t.id==='fStat'){fStat=t.value;lim=15;render();}
    else if(t.id==='pStat'){pStatF=t.value;lim=15;render();}
    else if(t.id==='eNip'||t.id==='eAcc')updPrev();
    else if(t.id==='eName'&&!ed){var c0=catFind(t.value);if(c0){$('eAcc').value=c0[2];$('eNip').value=c0[3];$('eCol').value=c0[1];updPrev();updSlots();}}
  });
  $('bd').addEventListener('click',close);
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'&&mode)close();
    else if(e.key==='Enter'&&e.target.id==='qName'){e.preventDefault();addName();}
  });

  load();render();
})();
</script>
</body>
</html>
